services:
  # DB Backup service for production environment
  db-backup:
    image: cr.yandex/your-registry/db-backup:${TAG:-latest}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      placement:
        constraints:
          - node.role == manager
    environment:
      - TIMEZONE=Europe/Moscow
      - CONTAINER_NAME=db-backup-prod
      - CONTAINER_ENABLE_MONITORING=TRUE
      - CONTAINER_MONITORING_BACKEND=prometheus
      - DEBUG_MODE=FALSE
      - LOG_LEVEL=critical

      # Yandex Lockbox configuration for production
      - YANDEX_LOCKBOX_SECRET_IDS=${YANDEX_LOCKBOX_SECRET_IDS}
      - YANDEX_LOCKBOX_AUTH_TYPE=${YANDEX_LOCKBOX_AUTH_TYPE:-metadata}
      - DEBUG_YANDEX_LOCKBOX=FALSE

      # Backup configuration
      - BACKUP_JOB_CONCURRENCY=2
      - DEFAULT_CHECKSUM=SHA1
      - DEFAULT_COMPRESSION=ZSTD
      - DEFAULT_BACKUP_INTERVAL=1440      # Every 24 hours
      - DEFAULT_BACKUP_BEGIN=0200         # Start at 2 AM
      - DEFAULT_CLEANUP_TIME=43200        # Keep for 30 days

      # Database configuration (passwords from Lockbox)
      - DB01_TYPE=${DB01_TYPE:-mariadb}
      - DB01_HOST=${DB01_HOST:-prod-db-host}
      - DB01_NAME=${DB01_NAME:-proddb}
      - DB01_USER=${DB01_USER:-produser}
      # DB01_PASS will be loaded from Yandex Lockbox
      - DB01_BACKUP_INTERVAL=1440
      - DB01_BACKUP_BEGIN=0200
      - DB01_CLEANUP_TIME=43200
      - DB01_CHECKSUM=SHA1
      - DB01_COMPRESSION=ZSTD

      # Additional databases can be configured here
      # - DB02_TYPE=postgres
      # - DB02_HOST=prod-postgres-host
      # - DB02_NAME=proddb2
      # - DB02_USER=produser2
      # DB02_PASS will be loaded from Yandex Lockbox

      # S3 configuration (if using S3 storage)
      - S3_BUCKET=${S3_BUCKET:-prod-backup-bucket}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://storage.yandexcloud.net}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # S3 credentials will be loaded from Yandex Lockbox

      # Notification configuration
      - NOTIFICATION_EMAIL_ENABLED=${NOTIFICATION_EMAIL_ENABLED:-TRUE}
      - NOTIFICATION_EMAIL_SMTP_HOST=${NOTIFICATION_EMAIL_SMTP_HOST:-}
      - NOTIFICATION_EMAIL_SMTP_PORT=${NOTIFICATION_EMAIL_SMTP_PORT:-587}
      - NOTIFICATION_EMAIL_SMTP_USER=${NOTIFICATION_EMAIL_SMTP_USER:-}
      - NOTIFICATION_EMAIL_SMTP_PASS=${NOTIFICATION_EMAIL_SMTP_PASS:-}
      - NOTIFICATION_EMAIL_FROM=${NOTIFICATION_EMAIL_FROM:-}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO:-}
      # Email credentials will be loaded from Yandex Lockbox

    networks:
      - db-backup-prod-network

networks:
  db-backup-prod-network:
    driver: overlay
    attachable: true
