version: '3.8'

services:
  # Example database
  example-db:
    hostname: example-db-host
    container_name: example-db
    image: tiredofit/mariadb:10.11
    ports:
      - 3306:3306
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - ROOT_PASS=examplerootpassword
      - DB_NAME=example
      - DB_USER=example
      - DB_PASS=examplepassword
    restart: always
    networks:
      - example-db-network

  # DB Backup with S3, Yandex Lockbox and Prometheus monitoring
  example-db-backup:
    container_name: example-db-backup
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9090:9090"  # Prometheus metrics endpoint
    environment:
      - TIMEZONE=Europe/Moscow
      - CONTAINER_NAME=example-db-backup
      - CONTAINER_ENABLE_MONITORING=TRUE
      - CONTAINER_MONITORING_BACKEND=prometheus
      - PROMETHEUS_PORT=9090
      - DEBUG_MODE=FALSE
      - DEBUG_PROMETHEUS=FALSE

      # Yandex Lockbox configuration
      - YANDEX_LOCKBOX_SECRET_IDS=e1q2w3e4r5t6y7u8i9o0p, a1s2d3f4g5h6j7k8l9z0x
      - YANDEX_LOCKBOX_AUTH_TYPE=metadata
      # For key authentication, uncomment and configure:
      # - YANDEX_LOCKBOX_AUTH_TYPE=key
      # - YANDEX_LOCKBOX_SERVICE_ACCOUNT_KEY={"id":"aje...","service_account_id":"aje...","private_key":"-----BEGIN PRIVATE KEY-----\n..."}
      - DEBUG_YANDEX_LOCKBOX=FALSE

      # Backup configuration
      - BACKUP_JOB_CONCURRENCY=1
      - DEFAULT_CHECKSUM=SHA1
      - DEFAULT_COMPRESSION=ZSTD
      - DEFAULT_BACKUP_INTERVAL=1440  # Every 24 hours
      - DEFAULT_BACKUP_BEGIN=+0
      - DEFAULT_CLEANUP_TIME=10080    # Keep for 7 days

      # S3 Configuration (credentials will be loaded from Yandex Lockbox)
      - DEFAULT_BACKUP_LOCATION=S3
      - DEFAULT_S3_BUCKET=my-backup-bucket
      - DEFAULT_S3_PATH=backups
      - DEFAULT_S3_REGION=ru-central1
      - DEFAULT_S3_HOST=storage.yandexcloud.net
      - DEFAULT_S3_PROTOCOL=https
      # S3 credentials will be loaded from Yandex Lockbox secrets:
      # - DEFAULT_S3_KEY_ID (from Lockbox)
      # - DEFAULT_S3_KEY_SECRET (from Lockbox)

      # Database configuration (passwords will be loaded from Lockbox)
      - DB01_TYPE=mariadb
      - DB01_HOST=example-db-host
      - DB01_NAME=example
      - DB01_USER=example
      # DB01_PASS will be loaded from Yandex Lockbox
      - DB01_BACKUP_INTERVAL=1440
      - DB01_BACKUP_BEGIN=+0
      - DB01_CLEANUP_TIME=10080
      - DB01_CHECKSUM=SHA1
      - DB01_COMPRESSION=ZSTD
      # S3 settings for this specific database (optional, will use defaults if not set)
      - DB01_BACKUP_LOCATION=S3
      - DB01_S3_BUCKET=my-backup-bucket
      - DB01_S3_PATH=backups/mariadb
      - DB01_S3_REGION=ru-central1
      - DB01_S3_HOST=storage.yandexcloud.net
      - DB01_S3_PROTOCOL=https

    restart: always
    networks:
      - example-db-network
    depends_on:
      - example-db

networks:
  example-db-network:
    driver: bridge
